name: Qualify ECS launch and runtime failures

on:
  workflow_dispatch:
    inputs:
      evidence_artifact:
        description: "Sanitized disposable-Cell ECS qualification evidence artifact"
        required: true
        type: string
      configuration_artifact:
        description: "Pinned release/Cell/task qualification configuration artifact"
        required: true
        type: string
      bindings_artifact:
        description: "Trusted source/plan/Deployment Identity binding artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    environment: ecs-launch-runtime-qualification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
      - name: Run credential-free ECS launch/runtime qualification
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-venv
        run: |
          uv run --locked pytest \
            runtime/process_manager/tests/test_launch.py \
            tests/contract/test_ecs_qualification.py \
            tests/contract/test_readiness_gate.py \
            -q -p no:cacheprovider
      - name: Project protected qualification evidence
        env:
          ECS_QUALIFICATION_PROOF_KEY: ${{ secrets.ECS_QUALIFICATION_PROOF_KEY }}
          EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
          CONFIGURATION_ARTIFACT: ${{ inputs.configuration_artifact }}
          BINDINGS_ARTIFACT: ${{ inputs.bindings_artifact }}
        run: |
          test -f "$EVIDENCE_ARTIFACT"
          test -f "$CONFIGURATION_ARTIFACT"
          test -f "$BINDINGS_ARTIFACT"
          python scripts/run_ecs_qualification.py \
            --evidence "$EVIDENCE_ARTIFACT" \
            --configuration "$CONFIGURATION_ARTIFACT" \
            --bindings "$BINDINGS_ARTIFACT" \
            --artifact-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/ecs-launch-runtime-manifest.json"
      - name: Publish sanitized qualification manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ecs-launch-runtime-qualification-manifest
          path: ${{ runner.temp }}/ecs-launch-runtime-manifest.json
          retention-days: 14
