name: Protected production recovery

on:
  workflow_dispatch:
    inputs:
      recovery_json: {required: true, type: string}
      execution_json: {required: true, type: string}

permissions:
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: production-recovery
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - name: Validate ordered recovery gate
        env:
          RECOVERY_JSON: ${{ inputs.recovery_json }}
          EXECUTION_JSON: ${{ inputs.execution_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.deployment_evidence import validate_recovery_execution, validate_recovery_plan
          recovery = json.loads(os.environ["RECOVERY_JSON"])
          execution = json.loads(os.environ["EXECUTION_JSON"])
          validate_recovery_plan(recovery)
          validate_recovery_execution(recovery, execution)
          if execution["fresh_plan_sha256"] == recovery.get("stale_plan_sha256"):
              raise SystemExit("RECOVERY_STALE_PLAN")
          record = {"schema_version":"1.0.0","status":"approved-for-fresh-plan-apply","recovery":recovery,"execution":execution,"launch_enabled":False}
          Path(os.environ["RUNNER_TEMP"]).joinpath("recovery-evidence.json").write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Publish protected recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-evidence.json
          retention-days: 7
          if-no-files-found: error
