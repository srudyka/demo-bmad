name: Qualify security and delivery boundaries

on:
  workflow_dispatch:
    inputs:
      evidence_artifact:
        description: "Artifact containing sanitized security evidence.json"
        required: true
        type: string
      bindings_artifact:
        description: "Artifact containing immutable qualification bindings.json"
        required: true
        type: string
      source_run_id:
        description: "Protected workflow run containing the evidence artifacts"
        required: true
        type: string
      source_commit:
        description: "Immutable commit qualified by the source workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: inputs.source_commit == github.sha
    runs-on: ubuntu-24.04
    environment: security-boundary-qualification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/security-qualification/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.bindings_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/security-qualification/bindings
      - name: Run credential-free security contract tests
        run: |
          uv run --locked pytest \
            tests/contract/test_security_qualification.py \
            tests/contract/test_contract_iam.py \
            tests/contract/test_contract_oidc.py \
            tests/contract/test_readiness_gate.py \
            -q -p no:cacheprovider
      - name: Project protected security evidence
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY_QUALIFICATION_ATTESTATION_KEY: ${{ secrets.SECURITY_QUALIFICATION_ATTESTATION_KEY }}
        run: |
          case "$SOURCE_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "${{ inputs.evidence_artifact }}" = "security-qualification-evidence"
          test "${{ inputs.bindings_artifact }}" = "security-qualification-bindings"
          run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
          run_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          run_event="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.event')"
          run_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.path')"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          test "$run_head_sha" = "$SOURCE_COMMIT"
          case "$run_event" in workflow_dispatch|workflow_call) ;; *) exit 1 ;; esac
          test "$run_path" = ".github/workflows/security-boundary-qualification.yml"
          test -f "$RUNNER_TEMP/security-qualification/evidence/evidence.json"
          test -f "$RUNNER_TEMP/security-qualification/bindings/bindings.json"
          python scripts/run_security_qualification.py \
            --evidence "$RUNNER_TEMP/security-qualification/evidence/evidence.json" \
            --bindings "$RUNNER_TEMP/security-qualification/bindings/bindings.json" \
            --artifact-root "$RUNNER_TEMP/security-qualification" \
            --output "$RUNNER_TEMP/security-qualification-manifest.json" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --expected-workflow-run-id "$SOURCE_RUN_ID"
      - name: Publish sanitized security qualification manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-boundary-qualification-manifest
          path: ${{ runner.temp }}/security-qualification-manifest.json
          retention-days: 14
