name: Record protected production emergency evidence

on:
  workflow_dispatch:
    inputs:
      emergency_json: {required: true, type: string}

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production-emergency-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
      - name: Validate and sanitize emergency evidence
        env:
          EMERGENCY_JSON: ${{ inputs.emergency_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.deployment_evidence import validate_emergency_record
          record = json.loads(os.environ["EMERGENCY_JSON"])
          validate_emergency_record(record)
          destination = Path(os.environ["RUNNER_TEMP"]) / "production-emergency-evidence.json"
          destination.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Publish short-lived emergency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-emergency-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/production-emergency-evidence.json
          retention-days: 7
          if-no-files-found: error
