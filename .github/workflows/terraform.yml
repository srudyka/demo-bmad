name: Terraform

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform.yml"
      - ".checkov.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform.yml"
      - ".checkov.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Init module
        run: terraform -chdir=modules/ecs-scheduled-job init -backend=false

      - name: Validate module
        run: terraform -chdir=modules/ecs-scheduled-job validate

      - name: Init basic example
        run: terraform -chdir=modules/ecs-scheduled-job/examples/basic init -backend=false

      - name: Validate basic example
        run: terraform -chdir=modules/ecs-scheduled-job/examples/basic validate

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
