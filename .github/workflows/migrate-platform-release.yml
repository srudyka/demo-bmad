name: Migrate compatible platform release

on:
  workflow_dispatch:
    inputs:
      source_commit: {required: true, type: string}
      migration_manifest_json: {required: true, type: string}
      phase: {required: true, type: choice, options: [expand, migrate, cutover, rollback]}
      source_snapshot: {required: true, type: string}
      target_snapshot: {required: true, type: string}
      operation_id: {required: true, type: string}
      checkpoint_id: {required: true, type: string}
      resumed: {required: true, type: boolean}
      observed_at: {required: true, type: string}
      verified_at: {required: true, type: string}
      ownership_evidence_json: {required: true, type: string}
      state_migration_evidence_json: {required: true, type: string}
      predecessor_evidence_json: {required: false, type: string, default: ""}
      phase_state_json: {required: true, type: string}
      acknowledgement_json: {required: false, type: string, default: ""}
      plan_evidence_json: {required: true, type: string}
      known_good_release: {required: false, type: string, default: ""}
      rollback_evidence_json: {required: false, type: string, default: ""}
      source_release_manifest: {required: true, type: string}
      target_release_manifest: {required: true, type: string}

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-migration-${{ inputs.source_commit }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.source_commit == github.sha
    runs-on: ubuntu-24.04
    environment: platform-migration
    timeout-minutes: 30
    steps:
      - name: Check out immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
      - name: Install locked validation environment
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Validate and execute the bounded phase
        env:
          MIGRATION_MANIFEST_JSON: ${{ inputs.migration_manifest_json }}
          SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
          TARGET_SNAPSHOT: ${{ inputs.target_snapshot }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CHECKPOINT_ID: ${{ inputs.checkpoint_id }}
          RESUMED: ${{ inputs.resumed }}
          OBSERVED_AT: ${{ inputs.observed_at }}
          VERIFIED_AT: ${{ inputs.verified_at }}
          OWNERSHIP_EVIDENCE_JSON: ${{ inputs.ownership_evidence_json }}
          STATE_MIGRATION_EVIDENCE_JSON: ${{ inputs.state_migration_evidence_json }}
          PREDECESSOR_EVIDENCE_JSON: ${{ inputs.predecessor_evidence_json }}
          PHASE_STATE_JSON: ${{ inputs.phase_state_json }}
          ACKNOWLEDGEMENT_JSON: ${{ inputs.acknowledgement_json }}
          PLAN_EVIDENCE_JSON: ${{ inputs.plan_evidence_json }}
          ROLLBACK_EVIDENCE_JSON: ${{ inputs.rollback_evidence_json }}
          MIGRATION_PHASE: ${{ inputs.phase }}
          KNOWN_GOOD_RELEASE: ${{ inputs.known_good_release }}
          ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_RELEASE_MANIFEST: ${{ inputs.source_release_manifest }}
          TARGET_RELEASE_MANIFEST: ${{ inputs.target_release_manifest }}
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv sync --locked
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv run --locked python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.migration_contract import (
              validate_cutover, validate_migration_manifest, validate_phase_evidence,
              validate_plan_binding, validate_predecessor_evidence, validate_rollback,
              validate_ownership_evidence, validate_state_migration_evidence,
              validate_phase_state,
          )
          from scripts.migration_executor import execute_bounded_phase
          from scripts.release_manifest import validate_release_manifest
          manifest = json.loads(os.environ["MIGRATION_MANIFEST_JSON"])
          validate_migration_manifest(manifest)
          if manifest["phase"] != os.environ["MIGRATION_PHASE"] or manifest["actor"] != os.environ["ACTOR"]:
              raise SystemExit("MIGRATION_BINDING")
          horizon = manifest["compatibility_horizon"]
          if horizon > 90:
              raise SystemExit("MIGRATION_EVIDENCE_RETENTION_LIMIT")
          for input_name, release_name in (("SOURCE_RELEASE_MANIFEST", "source_release"), ("TARGET_RELEASE_MANIFEST", "target_release")):
              path = Path(os.environ[input_name]).resolve()
              if not path.is_file() or path.is_absolute() and not str(path).startswith(str(Path.cwd().resolve())):
                  raise SystemExit("MIGRATION_RELEASE_PATH")
              release = json.loads(path.read_bytes())
              validate_release_manifest(release)
              if release["source_commit"] != os.environ["GITHUB_SHA"]:
                  raise SystemExit("MIGRATION_RELEASE_SOURCE_BINDING")
              if release["version"] != manifest[release_name]:
                  raise SystemExit("MIGRATION_RELEASE_VERSION_BINDING")
              if hashlib.sha256(path.read_bytes()).hexdigest() != manifest["source_release_sha256" if release_name == "source_release" else "target_release_sha256"]:
                  raise SystemExit("MIGRATION_RELEASE_CHECKSUM_BINDING")
              if release_name == "target_release":
                  target_components = release.get("component_versions")
                  target_ranges = release.get("schema_ranges")
                  if not isinstance(target_components, dict) or not isinstance(target_ranges, dict):
                      raise SystemExit("MIGRATION_RELEASE_COMPATIBILITY_MISSING")
                  for component, version in manifest["required_components"].items():
                      if target_components.get(component) != version:
                          raise SystemExit("MIGRATION_RELEASE_COMPONENT_BINDING")
                  for component, version_range in manifest["component_ranges"].items():
                      if target_ranges.get(component) != version_range:
                          raise SystemExit("MIGRATION_RELEASE_RANGE_BINDING")
          predecessor = json.loads(os.environ["PREDECESSOR_EVIDENCE_JSON"]) if os.environ["PREDECESSOR_EVIDENCE_JSON"] else None
          validate_predecessor_evidence(manifest, predecessor)
          validate_phase_state(json.loads(os.environ["PHASE_STATE_JSON"]), manifest, os.environ["OPERATION_ID"])
          phase_evidence = execute_bounded_phase(
              migration_id=manifest["migration_id"], phase=manifest["phase"],
              source_snapshot_path=Path(os.environ["SOURCE_SNAPSHOT"]).resolve(),
              target_snapshot_path=Path(os.environ["TARGET_SNAPSHOT"]).resolve(),
              source_release_sha256=manifest["source_release_sha256"],
              target_release_sha256=manifest["target_release_sha256"],
              operation_id=os.environ["OPERATION_ID"], checkpoint_id=os.environ["CHECKPOINT_ID"],
              resumed=os.environ["RESUMED"].lower() == "true",
              observed_at=os.environ["OBSERVED_AT"], verified_at=os.environ["VERIFIED_AT"],
          )
          validate_phase_evidence(manifest, phase_evidence, now=datetime.now(timezone.utc))
          validate_ownership_evidence(json.loads(os.environ["OWNERSHIP_EVIDENCE_JSON"]), now=datetime.now(timezone.utc))
          plan = json.loads(os.environ["PLAN_EVIDENCE_JSON"])
          validate_plan_binding(plan, manifest, now=datetime.now(timezone.utc))
          if plan["source_commit"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("MIGRATION_PLAN_SOURCE_BINDING")
          validate_state_migration_evidence(json.loads(os.environ["STATE_MIGRATION_EVIDENCE_JSON"]), plan)
          if manifest["phase"] == "cutover":
              acknowledgement = json.loads(os.environ["ACKNOWLEDGEMENT_JSON"])
              validate_cutover(manifest, acknowledgement, now=datetime.now(timezone.utc))
              if acknowledgement["plan_sha256"] != plan["plan_sha256"]:
                  raise SystemExit("MIGRATION_ACK_PLAN_BINDING")
              validate_state_migration_evidence(json.loads(os.environ["STATE_MIGRATION_EVIDENCE_JSON"]), plan)
          elif manifest["phase"] == "rollback":
              rollback_evidence = json.loads(os.environ["ROLLBACK_EVIDENCE_JSON"])
              if rollback_evidence.get("compatibility_supported") is not True:
                  raise SystemExit("MIGRATION_ROLLBACK_COMPATIBILITY")
              validate_rollback(manifest, known_good_release=os.environ["KNOWN_GOOD_RELEASE"], evidence_supported=rollback_evidence["compatibility_supported"], rollback_evidence=rollback_evidence)
          Path("phase-evidence.json").write_text(json.dumps(phase_evidence, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"status": "verified", "operation_id": phase_evidence["operation_id"], "phase": manifest["phase"]}, sort_keys=True))
          PY
      - name: Run credential-free migration qualification
        run: UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv run --locked python -m pytest tests/contract/test_migration_contract.py -q -p no:cacheprovider
      - name: Publish complete migration evidence
        env:
          MIGRATION_MANIFEST_JSON: ${{ inputs.migration_manifest_json }}
          SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
          TARGET_SNAPSHOT: ${{ inputs.target_snapshot }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CHECKPOINT_ID: ${{ inputs.checkpoint_id }}
          RESUMED: ${{ inputs.resumed }}
          OBSERVED_AT: ${{ inputs.observed_at }}
          VERIFIED_AT: ${{ inputs.verified_at }}
          OWNERSHIP_EVIDENCE_JSON: ${{ inputs.ownership_evidence_json }}
          STATE_MIGRATION_EVIDENCE_JSON: ${{ inputs.state_migration_evidence_json }}
          PREDECESSOR_EVIDENCE_JSON: ${{ inputs.predecessor_evidence_json }}
          PLAN_EVIDENCE_JSON: ${{ inputs.plan_evidence_json }}
          ROLLBACK_EVIDENCE_JSON: ${{ inputs.rollback_evidence_json }}
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv run --locked python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(os.environ["MIGRATION_MANIFEST_JSON"])
          evidence = {
              "schema_version": "1.0.0",
              "status": "verified",
              "manifest": manifest,
              "phase_evidence": json.loads(Path("phase-evidence.json").read_text(encoding="utf-8")),
              "ownership_evidence": json.loads(os.environ["OWNERSHIP_EVIDENCE_JSON"]),
              "state_migration_evidence": json.loads(os.environ["STATE_MIGRATION_EVIDENCE_JSON"]),
              "predecessor_evidence": json.loads(os.environ["PREDECESSOR_EVIDENCE_JSON"]) if os.environ["PREDECESSOR_EVIDENCE_JSON"] else None,
              "plan_evidence": json.loads(os.environ["PLAN_EVIDENCE_JSON"]) if os.environ["PLAN_EVIDENCE_JSON"] else None,
              "rollback_evidence": json.loads(os.environ["ROLLBACK_EVIDENCE_JSON"]) if os.environ["ROLLBACK_EVIDENCE_JSON"] else None,
              "known_limitations": ["Completion does not authorize deprecation or removal; Story 3.9 owns that boundary."],
          }
          Path("migration-evidence.json").write_text(json.dumps(evidence, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload migration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-evidence-${{ inputs.phase }}-${{ github.run_id }}
          path: migration-evidence.json
          if-no-files-found: error
          retention-days: 90
