name: Protected platform version retirement

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full commit that seals the retirement handoff
        required: true
        type: string
      handoff_path:
        description: Repository-relative, checked-in retirement handoff JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: none
  pull-requests: none
  deployments: none

concurrency:
  group: platform-retirement-${{ inputs.source_commit }}-${{ inputs.handoff_path }}
  cancel-in-progress: false

jobs:
  validate-and-submit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.source_commit == github.sha
    runs-on: ubuntu-24.04
    environment: production-retirement-approval
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
      - name: Install locked validation environment
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Validate exact retirement proof and protected withdrawal
        env:
          HANDOFF_PATH: ${{ inputs.handoff_path }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$HANDOFF_PATH" in
            contracts/retirement-handoffs/*.json) ;;
            *) exit 1 ;;
          esac
          test -f "$HANDOFF_PATH"
          resolved_handoff="$(realpath -e -- "$HANDOFF_PATH")"
          case "$resolved_handoff" in
            "$GITHUB_WORKSPACE"/contracts/retirement-handoffs/*.json) ;;
            *) exit 1 ;;
          esac
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv sync --locked
          PYTHONPATH="runtime/lifecycle_gc/src" UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv run --locked python - "$HANDOFF_PATH" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          from scripts.deprecation_contract import (
              parse_retirement_handoff_bytes,
              validate_retirement_handoff,
          )

          handoff_path = Path(sys.argv[1])
          raw_handoff = handoff_path.read_bytes()
          handoff = parse_retirement_handoff_bytes(raw_handoff)
          validate_retirement_handoff(handoff, now=datetime.now(timezone.utc))
          Path("validated-retirement-handoff.json").write_bytes(raw_handoff)
          Path("validated-retirement-submission.json").write_text(
              json.dumps(
                  {
                      "handoff_sha256": handoff["handoff_sha256"],
                      "handoff_file_sha256": hashlib.sha256(raw_handoff).hexdigest(),
                      "repository_id": os.environ["REPOSITORY_ID"],
                      "run_id": os.environ["RUN_ID"],
                      "environment": "production-retirement-approval",
                      "approval_sha256": handoff["protected_approval"]["approval_sha256"],
                      "source_commit": os.environ["SOURCE_COMMIT"],
                      "workflow_sha": os.environ["WORKFLOW_SHA"],
                      "status": "validated",
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish validated lifecycle submission envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-retirement-handoff-${{ github.run_id }}
          path: |
            validated-retirement-handoff.json
            validated-retirement-submission.json
          if-no-files-found: error
          retention-days: 90
