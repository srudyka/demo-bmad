name: Qualify completion deadlines and alert durability

on:
  workflow_dispatch:
    inputs:
      evidence_artifact:
        description: "Artifact name containing evidence.json"
        required: true
        type: string
      configuration_artifact:
        description: "Artifact name containing configuration.json"
        required: true
        type: string
      bindings_artifact:
        description: "Artifact name containing bindings.json"
        required: true
        type: string
      source_run_id:
        description: "Completed protected workflow run containing the three artifacts"
        required: true
        type: string
      source_commit:
        description: "Immutable commit qualified by the source workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: inputs.source_commit == github.sha
    runs-on: ubuntu-24.04
    environment: completion-deadline-alert-qualification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
      - name: Download signed qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/qualification/evidence
      - name: Download pinned qualification configuration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.configuration_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/qualification/configuration
      - name: Download trusted qualification bindings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.bindings_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/qualification/bindings
      - name: Run completion/deadline contract qualification
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-venv
        run: |
          uv run --locked pytest \
            runtime/process_manager/tests/test_process_manager.py \
            runtime/process_manager/tests/test_alert_outbox.py \
            tests/contract/test_completion_deadline_qualification.py \
            tests/contract/test_readiness_gate.py \
            -q -p no:cacheprovider
      - name: Project protected qualification evidence
        env:
          ECS_QUALIFICATION_PROOF_KEY: ${{ secrets.ECS_QUALIFICATION_PROOF_KEY }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          case "$SOURCE_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/qualification/evidence/evidence.json"
          test -f "$RUNNER_TEMP/qualification/configuration/configuration.json"
          test -f "$RUNNER_TEMP/qualification/bindings/bindings.json"
          python scripts/run_completion_deadline_qualification.py \
            --evidence "$RUNNER_TEMP/qualification/evidence/evidence.json" \
            --configuration "$RUNNER_TEMP/qualification/configuration/configuration.json" \
            --bindings "$RUNNER_TEMP/qualification/bindings/bindings.json" \
            --artifact-root "$RUNNER_TEMP/qualification" \
            --output "$RUNNER_TEMP/completion-deadline-alert-manifest.json"
      - name: Publish sanitized qualification manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: completion-deadline-alert-qualification-manifest
          path: ${{ runner.temp }}/completion-deadline-alert-manifest.json
          retention-days: 14
